<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choca Games Studio</title>
  <meta name="description" content="Choca Games Studio: um grupo de amigos do Acre que quer contar histórias que cativem através de jogos." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #09090b; }
    .animate-spin-slow { animation: spin 4s linear infinite; }
    .animate-loading-bar { animation: loading 2s ease-in-out forwards; }
    .animate-float { animation: float infinite linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loading { 0% { width: 0%; } 100% { width: 100%; } }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.2; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
    .bg-acre-flag { background: linear-gradient(135deg, #FDE021 50%, #00923F 50%); }
    .reveal { opacity: 0; transform: translateY(3rem); transition: all 1000ms ease-out; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .conic-spin { animation: spin 4s linear infinite; background: conic-gradient(from 0deg, #FDE021, #00923F, #EF2836, #FDE021); }
    [data-lucide] { display: inline-block; }
  </style>
</head>
<body class="min-h-screen font-sans text-zinc-300 selection:bg-red-600/30 selection:text-white overflow-x-hidden">

  <!-- Loading -->

          <a href="#about" data-i18n="nav.about" class="text-zinc-300 hover:text-yellow-400 transition-colors text-sm font-bold uppercase tracking-wider"></a>

            </div>
          </div>
        </div>

        <div class="reveal" style="transition-delay:400ms">
          <div class="mt-32 pt-16 border-t border-zinc-800">

              <h3 data-i18n="about.daily" class="text-2xl font-black text-white uppercase tracking-wider"></h3>

    <!-- Games -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-16 mb-16">

        <div>

          <ul class="space-y-4">
            <li><a href="#home" data-i18n="nav.home" class="text-zinc-400 hover:text-yellow-400 transition-colors uppercase text-xs font-bold"></a></li>

            <a href="https://www.instagram.com/chocagamesstudio/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="w-12 h-12 bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:bg-yellow-400 hover:text-zinc-950 hover:border-yellow-400 transition-all">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>

              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>

  <script>
    const translations = {
      pt: {
        nav: { home: 'Início', about: 'Sobre Nós', games: 'Nossos Jogos', contact: 'Contato' },
        hero: {
          tag: 'Estúdio Indie do Acre, Brasil',
          title1: 'Criando Jogos no',
          title2: 'Coração da Floresta',
          desc: 'Somos a Choca Games Studio. Um grupo de amigos que quer contar histórias que cativem através de jogos.',
          btnPrimary: 'Explorar Jogos',
          btnSecondary: 'Nossa História'
        },
        about: {
          title1: 'Sobre',
          title2: 'Nós',
          p1: '<strong class="text-white">Choca Games Studio</strong> é um estúdio indie de jogos lá do Acre, bem no cantinho da região Norte do Brasil. Somos quatro estudantes de Sistemas de Informação da UFAC que descobriram que dá pra usar tudo que aprendemos (e muita coisa que não estava na ementa) pra fazer jogos.',
          p2: 'O nome vem da <strong class="text-white">choca-do-acre</strong>, uma ave que só vive por aqui, no nosso quintal amazônico. Raridade, personalidade forte e orgulho de ser da terra: a gente se identificou na hora. Além disso, “choca” combina com a gente: chocamos ideias, chocamos protótipos e, de vez em quando, chocamos um bug que ninguém sabe de onde veio.',
          p3: 'Não temos gênero favorito, e isso é de propósito. Queremos fazer jogos variados, desde que tenham uma história que prenda e uma jogabilidade que dê vontade de falar “só mais uma partida”. Se faltar um dos dois, volta pro ninho e a gente choca de novo.',
          quote: '“Feito no Acre, jogado onde você estiver.”',
          daily: 'Nosso Dia a Dia'
        },
        photos: ['Desenvolvimento 1', 'Testes Alpha', 'Reunião de Equipe', 'Design de Fase', 'Gravação de Áudio'],
        games: {
          title: 'Nossos Títulos',
          subtitle: 'Dê uma olhada no que estamos preparando na nossa forja na floresta.',
          wishlist: 'Adicionar à Lista de Desejos',
          statusDev: 'Em Desenvolvimento',
          statusAlpha: 'Alpha',
          statusConcept: 'Conceito'
        },
        footer: {
          desc: 'Um estúdio independente baseado no Acre, Brasil. Criando mundos imersivos inspirados pela Amazônia.',
          quickLinks: 'Links Rápidos',
          connect: 'Conecte-se',
          rights: 'Todos os direitos reservados.'
        }
      },
      en: {
        nav: { home: 'Home', about: 'About Us', games: 'Our Games', contact: 'Contact' },
        hero: {
          tag: 'Indie Game Studio from Acre, Brazil',
          title1: 'Crafting Games in the',
          title2: 'Heart of the Forest',
          desc: 'We are Choca Games Studio. A group of friends who want to tell captivating stories through games.',
          btnPrimary: 'Explore Games',
          btnSecondary: 'Our Story'
        },
        about: {
          title1: 'The Spirit of the',
          title2: 'Choca-do-Acre',
          p1: '<strong class="text-white">Choca Games Studio</strong> is an indie game studio from Acre, tucked away in the northern corner of Brazil. We are four Information Systems students at UFAC who found out that everything we learned (and plenty that wasn\'t in the syllabus) can be used to make games.',
          p2: 'The name comes from the <strong class="text-white">choca-do-acre</strong> (the Acre antshrike), a bird that lives only around here, in our Amazonian backyard. Rare, strong-willed and proud of its home: we saw ourselves in it right away. Besides, "choca" (Portuguese for "to hatch") suits us: we hatch ideas, we hatch prototypes and, once in a while, we hatch a bug nobody knows the origin of.',
          p3: 'We have no favorite genre, and that\'s on purpose. We want to make varied games, as long as they have a story that hooks you and gameplay that makes you say "just one more round". If either is missing, it goes back to the nest and we hatch it again.',
          quote: '"Made in Acre, played wherever you are."',
          daily: 'Behind the Scenes'
        },
        photos: ['Development 1', 'Alpha Testing', 'Team Meeting', 'Level Design', 'Audio Recording'],
        games: {
          title: 'Our Upcoming Titles',
          subtitle: 'Sneak a peek at what\'s currently brewing in our forest forge.',
          wishlist: 'Add to Wishlist',
          statusDev: 'In Development',
          statusAlpha: 'Alpha',
          statusConcept: 'Concept'
        },
        footer: {
          desc: 'An independent game studio based in Acre, Brazil. Crafting immersive worlds inspired by the Amazon.',
          quickLinks: 'Quick Links',
          connect: 'Connect',
          rights: 'All rights reserved.'
        }
      }
    };

    let lang = 'pt';
    let currentIndex = 0;
    const get = (obj, path) => path.split('.').reduce((o, k) => o && o[k], obj);

    /* ---------- Games ---------- */
    const games = [
      { title: 'Project Y', genre: 'Adventure', status: 'statusDev', icon: 'layers', color: 'yellow' },
      { title: 'Project G', genre: 'Strategy', status: 'statusAlpha', icon: 'leaf', color: 'green' },
      { title: 'Project R', genre: 'Action RPG', status: 'statusConcept', icon: 'swords', color: 'red' }
    ];
    const palette = {
      yellow: { text: 'text-yellow-400', border: 'hover:border-yellow-500', tag: 'text-yellow-400 border-yellow-400', bg: 'bg-yellow-400', icon: 'text-yellow-400' },
      green:  { text: 'text-green-500',  border: 'hover:border-green-500',  tag: 'text-green-500 border-green-500',   bg: 'bg-green-500',  icon: 'text-green-500' },
      red:    { text: 'text-red-500',    border: 'hover:border-red-500',    tag: 'text-red-500 border-red-500',       bg: 'bg-red-600',    icon: 'text-red-500' }
    };

    function renderGames() {
      const t = translations[lang];
      document.getElementById('games-grid').innerHTML = games.map((g, i) => {
        const p = palette[g.color];
        return `
        <div class="reveal visible" style="transition-delay:${i * 150}ms">
          <div class="group bg-zinc-900 border-2 border-zinc-800 ${p.border} transition-all duration-300 hover:-translate-y-2 flex flex-col h-full">
            <div class="h-48 bg-zinc-950 border-b border-zinc-800 flex items-center justify-center relative overflow-hidden">
              <div class="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-500 ${p.bg}"></div>
              <div class="transform group-hover:scale-125 transition-transform duration-700 z-10">
                <i data-lucide="${g.icon}" class="w-12 h-12 ${p.icon}"></i>
              </div>
              <div class="absolute top-4 right-4 bg-zinc-900 px-3 py-1 text-xs font-bold uppercase tracking-wider border ${p.tag}">${t.games[g.status]}</div>
            </div>
            <div class="p-8 flex-grow flex flex-col">
              <div class="text-xs font-bold uppercase tracking-wider mb-2 ${p.text}">${g.genre}</div>
              <h3 class="text-2xl font-black text-white mb-4 uppercase">${g.title}</h3>
              <p class="text-zinc-400 flex-grow mb-8 text-sm leading-relaxed">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip.
              </p>
              <button class="w-full py-4 px-4 bg-zinc-800 hover:bg-zinc-700 text-white font-bold uppercase tracking-wider transition-colors flex items-center justify-center group/btn text-sm">
                ${t.games.wishlist}
                <i data-lucide="arrow-right" class="w-4 h-4 ml-3 group-hover/btn:translate-x-2 transition-transform"></i>
              </button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    /* ---------- Carousel ---------- */
    function renderCarousel() {
      const labels = translations[lang].photos;
      const n = labels.length;
      const prevI = (currentIndex - 1 + n) % n;
      const nextI = (currentIndex + 1) % n;
      const el = document.getElementById('carousel');
      el.innerHTML = labels.map((label, i) => {
        let cls, z;
        if (i === currentIndex) { z = 20; cls = 'scale-100 md:scale-110 translate-x-0 opacity-100 shadow-[0_0_30px_rgba(0,146,63,0.3)]'; }
        else if (i === prevI)   { z = 10; cls = 'scale-75 -translate-x-[50%] md:-translate-x-[75%] opacity-40 blur-[1px]'; }
        else if (i === nextI)   { z = 10; cls = 'scale-75 translate-x-[50%] md:translate-x-[75%] opacity-40 blur-[1px]'; }
        else return '';
        return `
        <div data-i="${i}" class="car-item absolute w-full max-w-xs md:max-w-[400px] aspect-video bg-zinc-800 rounded-xl transition-all duration-700 ease-in-out ${cls} border border-zinc-700 flex flex-col items-center justify-center overflow-hidden cursor-pointer" style="z-index:${z}">
          <i data-lucide="image" class="w-12 h-12 text-zinc-600 mb-3"></i>
          <span class="text-zinc-500 font-bold uppercase tracking-wider text-sm">${label}</span>
        </div>`;
      }).join('');
      lucide.createIcons();
      el.querySelectorAll('.car-item').forEach(item => {
        item.addEventListener('click', () => {
          const i = Number(item.dataset.i);
          if (i === prevI) prev();
          if (i === nextI) next();
        });
      });
    }
    const next = () => { currentIndex = (currentIndex + 1) % translations[lang].photos.length; renderCarousel(); };
    const prev = () => { currentIndex = (currentIndex - 1 + translations[lang].photos.length) % translations[lang].photos.length; renderCarousel(); };
    document.getElementById('car-next').addEventListener('click', next);
    document.getElementById('car-prev').addEventListener('click', prev);

    /* ---------- i18n ---------- */
    function applyLang() {
      const t = translations[lang];
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = get(t, el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = get(t, el.dataset.i18nHtml); });
      document.querySelectorAll('.lang-label').forEach(el => { el.textContent = lang === 'pt' ? 'PT-BR' : 'EN'; });
      renderGames();
      renderCarousel();
      lucide.createIcons();
    }
    document.querySelectorAll('.lang-toggle').forEach(b => b.addEventListener('click', () => {
      lang = lang === 'pt' ? 'en' : 'pt';
      applyLang();
    }));

    /* ---------- Mobile menu ---------- */
    const menu = document.getElementById('mobile-menu');
    const menuBtn = document.getElementById('menu-btn');
    function setMenuIcon(open) {
      menuBtn.innerHTML = `<i data-lucide="${open ? 'x' : 'menu'}" class="h-6 w-6"></i>`;
      lucide.createIcons();
    }
    menuBtn.addEventListener('click', () => { setMenuIcon(menu.classList.toggle('hidden') === false); });
    document.querySelectorAll('.mobile-link').forEach(a => a.addEventListener('click', () => { menu.classList.add('hidden'); setMenuIcon(false); }));

    /* ---------- Particles ---------- */
    (function () {
      const colors = ['bg-yellow-400', 'bg-green-600', 'bg-red-600'];
      const box = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const d = document.createElement('div');
        const size = Math.random() * 6 + 2;
        d.className = `absolute rounded-full opacity-20 animate-float ${colors[Math.floor(Math.random() * colors.length)]}`;
        d.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;bottom:-10px;animation-duration:${Math.random() * 10 + 10}s;animation-delay:-${Math.random() * 10}s`;
        box.appendChild(d);
      }
    })();

    /* ---------- Reveal on scroll ---------- */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    /* ---------- Init ---------- */
    document.getElementById('year').textContent = new Date().getFullYear();
    applyLang();
    document.querySelectorAll('.reveal:not(.visible)').forEach(el => observer.observe(el));

    setTimeout(() => {
      const l = document.getElementById('loading');
      l.style.opacity = 0;
      setTimeout(() => l.remove(), 500);
    }, 2000);
  </script>
</body>
</html>
